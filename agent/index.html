<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PiLoad</title>
    <style>
      :root {
        --bg: #0c0d0f;
        --surface: #15171b;
        --elevated: #1c1f25;
        --fg: #eceef1;
        --muted: #9aa1ab;
        --subtle: #6e7580;
        --accent: #d7dde6;
        --accent-fg: #0c0d0f;
        --border: #2a2e36;
        --ok: #7d9b86;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.5 Figtree, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 40px; margin: 0; }
      p.lead { color: var(--muted); max-width: 36rem; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      textarea, input {
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      textarea { min-height: 88px; }
      button.primary {
        margin-top: 16px;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
        cursor: pointer;
      }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; }
      .meta { color: var(--subtle); font: 12px/1.4 ui-monospace, monospace; }
      #status { color: var(--ok); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="meta">DietPi · yt-dlp Agent</p>
      <h1>PiLoad</h1>
      <p class="lead">Diese Seite läuft direkt auf dem Raspberry Pi. URL einfügen, Download startet lokal mit den optimalen yt-dlp-Flags.</p>
      <p id="status">prüfe Agent …</p>
      <form class="card" id="form">
        <label for="url">Video-URL</label>
        <textarea id="url" required placeholder="https://www.youtube.com/watch?v=…"></textarea>
        <label for="quality" style="margin-top:14px">Qualität</label>
        <input id="quality" value="auto" list="presets" />
        <datalist id="presets">
          <option value="auto"></option>
          <option value="best"></option>
          <option value="1080"></option>
          <option value="720"></option>
          <option value="audio"></option>
        </datalist>
        <button class="primary" type="submit">Auf diesem Pi laden</button>
      </form>
      <pre class="card meta" id="log"></pre>
    </main>
    <script>
      const status = document.getElementById("status");
      const log = document.getElementById("log");
      fetch("/api/health")
        .then((r) => r.json())
        .then((h) => {
          status.textContent = h.hostname + " · yt-dlp " + h.ytDlp + " · frei " + h.freeGb + " GB";
        })
        .catch(() => {
          status.textContent = "Agent nicht erreichbar";
        });
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = {
          url: document.getElementById("url").value,
          quality: document.getElementById("quality").value || "auto",
        };
        const res = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const job = await res.json();
        log.textContent = JSON.stringify(job, null, 2);
      });
    </script>
  </body>
</html>
