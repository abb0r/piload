name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build PiLoad
        run: |
          pyinstaller --noconfirm --windowed --onedir --noupx --name PiLoad --icon desktop/piload.ico --version-file desktop/file_version.txt --hidden-import PIL --hidden-import PIL.Image --collect-all PIL --add-data "desktop/piload.ico;." --add-data "desktop/piload.png;." desktop/piload.py
          Compress-Archive -Path dist\PiLoad -DestinationPath dist\PiLoad-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PiLoad-windows
          path: dist/PiLoad-windows.zip
