name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: MinGW
        run: choco install mingw -y --no-progress
      - name: Build PiLoad.exe
        shell: bash
        run: |
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/mingw64/bin:$PATH"
          go version
          gcc --version
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico desktop/piload.ico -o cmd/piload/rsrc_windows.syso
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.Version=0.2.2" -o PiLoad.exe ./cmd/piload
      - uses: actions/upload-artifact@v4
        with:
          name: PiLoad-windows
          path: PiLoad.exe
