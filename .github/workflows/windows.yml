name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build PiLoad.exe
        run: |
          pyinstaller --noconfirm --windowed --onefile --noupx --name PiLoad --icon desktop/piload.ico --version-file desktop/file_version.txt --add-data "desktop/piload.ico;." desktop/piload.py
      - uses: actions/upload-artifact@v4
        with:
          name: PiLoad-windows
          path: dist/PiLoad.exe
